# CloudLab CD — main branch only
# Build → Registry push → optional remote deploy → health → Discord
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip remote deploy (image push only)"
        type: boolean
        default: false

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend test
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8080/ws' }}
        run: npm ci && npm run build

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      version: ${{ steps.meta.outputs.version }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      pushed: ${{ steps.meta.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "version=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "backend_image=${DOCKERHUB_USERNAME}/cloudlab-backend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "frontend_image=${DOCKERHUB_USERNAME}/cloudlab-frontend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "PUSH=true" >> "$GITHUB_ENV"
            echo "BACKEND_TAGS=${DOCKERHUB_USERNAME}/cloudlab-backend:${SHA_SHORT},${DOCKERHUB_USERNAME}/cloudlab-backend:latest" >> "$GITHUB_ENV"
            echo "FRONTEND_TAGS=${DOCKERHUB_USERNAME}/cloudlab-frontend:${SHA_SHORT},${DOCKERHUB_USERNAME}/cloudlab-frontend:latest" >> "$GITHUB_ENV"
          else
            echo "backend_image=cloudlab-backend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "frontend_image=cloudlab-frontend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "PUSH=false" >> "$GITHUB_ENV"
            echo "BACKEND_TAGS=cloudlab-backend:${SHA_SHORT}" >> "$GITHUB_ENV"
            echo "FRONTEND_TAGS=cloudlab-frontend:${SHA_SHORT}" >> "$GITHUB_ENV"
            echo "::warning::DOCKERHUB secrets missing — build only, no registry push"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ env.BACKEND_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ env.FRONTEND_TAGS }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8080/ws' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (SSH rolling update)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      github.ref == 'refs/heads/main' &&
      needs.build-and-push.outputs.pushed == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set — skip remote deploy"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Remote deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          DEPLOY_MODE: ${{ secrets.DEPLOY_MODE }}
        run: |
          export DEPLOY_USER="${DEPLOY_USER:-ubuntu}"
          export DEPLOY_PORT="${DEPLOY_PORT:-22}"
          export DEPLOY_MODE="${DEPLOY_MODE:-compose}"
          chmod +x scripts/ci/remote-deploy.sh
          scripts/ci/remote-deploy.sh

      - name: Health check
        if: steps.check.outputs.enabled == 'true'
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          URL="${HEALTH_URL:-http://${DEPLOY_HOST}:8080/actuator/health}"
          chmod +x scripts/ci/health-check.sh
          scripts/ci/health-check.sh "$URL"

  notify:
    name: Discord notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always() && needs.build-and-push.result != 'cancelled'
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS_BUILD: ${{ needs.build-and-push.result }}
          STATUS_DEPLOY: ${{ needs.deploy.result }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skip"
            exit 0
          fi
          if [ "$STATUS_BUILD" = "success" ] && { [ "$STATUS_DEPLOY" = "success" ] || [ "$STATUS_DEPLOY" = "skipped" ]; }; then
            COLOR=5763719
            TITLE="CloudLab CD success"
          else
            COLOR=15548997
            TITLE="CloudLab CD failed"
          fi
          SHORT="${SHA:0:7}"
          jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg version "${VERSION:-n/a}" \
            --arg build "$STATUS_BUILD" \
            --arg deploy "$STATUS_DEPLOY" \
            --arg actor "$ACTOR" \
            --arg short "$SHORT" \
            --arg sha "$SHA" \
            --arg repo "$REPO" \
            --arg run "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "Version", value: $version, inline: true},
                  {name: "Build", value: $build, inline: true},
                  {name: "Deploy", value: $deploy, inline: true},
                  {name: "Actor", value: $actor, inline: true},
                  {name: "Commit", value: ("[`" + $short + "`](https://github.com/" + $repo + "/commit/" + $sha + ")"), inline: false},
                  {name: "Run", value: ("[Open Actions](" + $run + ")"), inline: false}
                ]
              }]
            }' | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK" || true
