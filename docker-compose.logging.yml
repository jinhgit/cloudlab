# CloudLab Logging overlay (Step 8) — Loki + Promtail
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
#   # with monitoring (Grafana Loki DS):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml -f docker-compose.logging.yml up -d
#   ./scripts/logging-up.sh

services:
  loki:
    image: grafana/loki:3.2.1
    container_name: cloudlab-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - cloudlab_loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/ready | grep -q ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cloudlab

  promtail:
    image: grafana/promtail:3.2.1
    container_name: cloudlab-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "${PROMTAIL_PORT:-9080}:9080"
    networks:
      - cloudlab

volumes:
  cloudlab_loki_data:
    name: cloudlab_loki_data
