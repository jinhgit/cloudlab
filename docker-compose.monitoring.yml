# CloudLab Observability overlay (Step 7)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   ./scripts/monitoring-up.sh

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cloudlab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - cloudlab_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      alertmanager:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - cloudlab

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cloudlab-alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - cloudlab_alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - cloudlab

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cloudlab-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - cloudlab_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - cloudlab

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cloudlab-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - cloudlab

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cloudlab-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    networks:
      - cloudlab

volumes:
  cloudlab_prometheus_data:
    name: cloudlab_prometheus_data
  cloudlab_alertmanager_data:
    name: cloudlab_alertmanager_data
  cloudlab_grafana_data:
    name: cloudlab_grafana_data
