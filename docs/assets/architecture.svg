<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="CloudLab System Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a2f"/>
      <stop offset="100%" stop-color="#0f2920"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2f1e"/>
      <stop offset="100%" stop-color="#29200f"/>
    </linearGradient>
    <linearGradient id="obs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1e2f"/>
      <stop offset="100%" stop-color="#29101f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#bg)"/>
  <text x="40" y="42" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">CloudLab — System Architecture</text>
  <text x="40" y="66" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Self-Hosted DevOps Platform · Single Node (Ubuntu)</text>

  <!-- Internet -->
  <rect x="380" y="90" width="200" height="44" rx="10" fill="#0ea5e9" filter="url(#shadow)"/>
  <text x="480" y="117" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Internet / Browser</text>

  <line x1="480" y1="134" x2="480" y2="160" stroke="#64748b" stroke-width="2"/>
  <polygon points="480,168 474,156 486,156" fill="#64748b"/>

  <!-- Edge -->
  <rect x="40" y="172" width="880" height="100" rx="14" fill="url(#edge)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="198" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">EDGE</text>
  <rect x="80" y="214" width="360" height="40" rx="8" fill="#082f49"/>
  <text x="260" y="239" text-anchor="middle" fill="#e0f2fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Cloudflare Tunnel (HTTPS)</text>
  <rect x="480" y="214" width="400" height="40" rx="8" fill="#082f49"/>
  <text x="680" y="239" text-anchor="middle" fill="#e0f2fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Nginx Reverse Proxy</text>

  <line x1="480" y1="272" x2="480" y2="298" stroke="#64748b" stroke-width="2"/>
  <polygon points="480,306 474,294 486,294" fill="#64748b"/>

  <!-- App -->
  <rect x="40" y="310" width="880" height="130" rx="14" fill="url(#app)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="336" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">APPLICATION / CONTROL PLANE</text>
  <rect x="80" y="354" width="400" height="64" rx="8" fill="#064e3b"/>
  <text x="280" y="380" text-anchor="middle" fill="#ecfdf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Next.js Dashboard</text>
  <text x="280" y="400" text-anchor="middle" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">TypeScript · Tailwind · shadcn/ui</text>
  <rect x="520" y="354" width="360" height="64" rx="8" fill="#064e3b"/>
  <text x="700" y="380" text-anchor="middle" fill="#ecfdf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Spring Boot Platform API</text>
  <text x="700" y="400" text-anchor="middle" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Java 21 · REST + WebSocket · JWT</text>

  <line x1="480" y1="440" x2="480" y2="466" stroke="#64748b" stroke-width="2"/>
  <polygon points="480,474 474,462 486,462" fill="#64748b"/>

  <!-- Runtime + Data + Obs -->
  <rect x="40" y="478" width="280" height="160" rx="14" fill="url(#data)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="504" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">RUNTIME</text>
  <text x="60" y="534" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Docker Engine</text>
  <text x="60" y="558" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Kubernetes (k3s)</text>
  <text x="60" y="582" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Helm Charts</text>
  <text x="60" y="606" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Workloads / Pods</text>

  <rect x="340" y="478" width="280" height="160" rx="14" fill="url(#data)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="504" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">DATA</text>
  <text x="360" y="534" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• PostgreSQL</text>
  <text x="360" y="558" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Redis</text>
  <text x="360" y="582" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Users / Audit / Settings</text>
  <text x="360" y="606" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">• Deploy history</text>

  <rect x="640" y="478" width="280" height="160" rx="14" fill="url(#obs)" stroke="#f472b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="504" fill="#f9a8d4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">OBSERVABILITY</text>
  <text x="660" y="530" fill="#fce7f3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">• Prometheus · Grafana</text>
  <text x="660" y="550" fill="#fce7f3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">• Loki · Promtail</text>
  <text x="660" y="570" fill="#fce7f3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">• Alertmanager → Discord</text>
  <text x="660" y="590" fill="#fce7f3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">• Node Exporter · cAdvisor</text>
  <text x="660" y="610" fill="#fce7f3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">• Spring Actuator</text>

  <text x="480" y="680" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Host: Ubuntu Server · Browser never talks to Docker/K8s/Prometheus directly (Platform API only)</text>
  <text x="480" y="700" text-anchor="middle" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CloudLab v1 · Portfolio Platform Engineering</text>
</svg>
