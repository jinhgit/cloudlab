<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="CloudLab Technology Stack">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" fill="url(#bg2)"/>
  <text x="40" y="42" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">CloudLab — Technology Stack</text>
  <text x="40" y="66" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Frontend · Backend · DevOps · Observability</text>

  <!-- Frontend -->
  <rect x="40" y="100" width="210" height="400" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="40" y="100" width="210" height="44" rx="14" fill="#1d4ed8"/>
  <rect x="40" y="128" width="210" height="16" fill="#1d4ed8"/>
  <text x="145" y="128" text-anchor="middle" fill="#eff6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Frontend</text>
  <text x="60" y="175" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Next.js</text>
  <text x="60" y="200" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">TypeScript</text>
  <text x="60" y="225" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">TailwindCSS</text>
  <text x="60" y="250" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">shadcn/ui</text>
  <text x="60" y="275" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">React Query</text>
  <text x="60" y="300" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Zustand</text>
  <text x="60" y="325" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Socket.IO</text>
  <text x="60" y="350" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Recharts</text>
  <text x="60" y="390" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">운영 콘솔 UI</text>
  <text x="60" y="410" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">다크 테마 기본</text>

  <!-- Backend -->
  <rect x="270" y="100" width="210" height="400" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <rect x="270" y="100" width="210" height="44" rx="14" fill="#047857"/>
  <rect x="270" y="128" width="210" height="16" fill="#047857"/>
  <text x="375" y="128" text-anchor="middle" fill="#ecfdf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Backend</text>
  <text x="290" y="175" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Spring Boot</text>
  <text x="290" y="200" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Java 21</text>
  <text x="290" y="225" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Spring Security</text>
  <text x="290" y="250" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">JWT / Roles</text>
  <text x="290" y="275" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Actuator</text>
  <text x="290" y="300" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">WebSocket</text>
  <text x="290" y="325" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">JPA</text>
  <text x="290" y="350" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">PostgreSQL</text>
  <text x="290" y="375" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Redis</text>
  <text x="290" y="410" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Platform API</text>
  <text x="290" y="430" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">어댑터 패턴</text>

  <!-- DevOps -->
  <rect x="500" y="100" width="210" height="400" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="500" y="100" width="210" height="44" rx="14" fill="#b45309"/>
  <rect x="500" y="128" width="210" height="16" fill="#b45309"/>
  <text x="605" y="128" text-anchor="middle" fill="#fffbeb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">DevOps</text>
  <text x="520" y="175" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Docker</text>
  <text x="520" y="200" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Docker Compose</text>
  <text x="520" y="225" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">k3s / Helm</text>
  <text x="520" y="250" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">GitHub Actions</text>
  <text x="520" y="275" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Nginx</text>
  <text x="520" y="300" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Cloudflare Tunnel</text>
  <text x="520" y="325" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Linux (Ubuntu)</text>
  <text x="520" y="350" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Docker Hub</text>
  <text x="520" y="390" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Self-hosted CI/CD</text>
  <text x="520" y="410" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Rolling Update</text>

  <!-- Observability -->
  <rect x="730" y="100" width="190" height="400" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
  <rect x="730" y="100" width="190" height="44" rx="14" fill="#9d174d"/>
  <rect x="730" y="128" width="190" height="16" fill="#9d174d"/>
  <text x="825" y="128" text-anchor="middle" fill="#fdf2f8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Observability</text>
  <text x="750" y="175" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Prometheus</text>
  <text x="750" y="200" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Grafana</text>
  <text x="750" y="225" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Loki</text>
  <text x="750" y="250" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Promtail</text>
  <text x="750" y="275" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Alertmanager</text>
  <text x="750" y="300" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Node Exporter</text>
  <text x="750" y="325" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">cAdvisor</text>
  <text x="750" y="350" fill="#fbcfe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Discord Alert</text>
  <text x="750" y="390" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Metrics · Logs</text>
  <text x="750" y="410" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Alerts · Traces*</text>
  <text x="750" y="520" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">*Traces: v1 optional</text>
</svg>
