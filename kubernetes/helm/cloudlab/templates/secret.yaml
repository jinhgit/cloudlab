{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudlab-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cloudlab.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
