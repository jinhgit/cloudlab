apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudlab-postgres-pvc
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-postgres
    app.kubernetes.io/part-of: cloudlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # k3s default local-path storage class usually applies automatically
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudlab-postgres
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-postgres
    app.kubernetes.io/part-of: cloudlab
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudlab-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudlab-postgres
        app.kubernetes.io/part-of: cloudlab
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudlab-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudlab-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudlab-postgres
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-postgres
    app.kubernetes.io/part-of: cloudlab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudlab-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
