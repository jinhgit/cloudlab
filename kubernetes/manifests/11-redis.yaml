apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudlab-redis-pvc
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-redis
    app.kubernetes.io/part-of: cloudlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudlab-redis
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-redis
    app.kubernetes.io/part-of: cloudlab
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudlab-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudlab-redis
        app.kubernetes.io/part-of: cloudlab
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudlab-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudlab-redis
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-redis
    app.kubernetes.io/part-of: cloudlab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudlab-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
