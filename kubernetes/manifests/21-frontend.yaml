apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudlab-frontend
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-frontend
    app.kubernetes.io/part-of: cloudlab
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudlab-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudlab-frontend
        app.kubernetes.io/part-of: cloudlab
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: frontend
          image: cloudlab-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: cloudlab-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cloudlab-frontend
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-frontend
    app.kubernetes.io/part-of: cloudlab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudlab-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
