# Optional NodePort exposure for labs without DNS / Ingress.
# Apply separately if you prefer: kubectl apply -f 31-nodeport.yaml
apiVersion: v1
kind: Service
metadata:
  name: cloudlab-frontend-nodeport
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-frontend
    app.kubernetes.io/part-of: cloudlab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cloudlab-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: cloudlab-backend-nodeport
  namespace: cloudlab
  labels:
    app.kubernetes.io/name: cloudlab-backend
    app.kubernetes.io/part-of: cloudlab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cloudlab-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30088
