# Rendered at container start when DISCORD_WEBHOOK_URL is provided.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity", "service"]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "${DISCORD_WEBHOOK_URL}"
        send_resolved: true
